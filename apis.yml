name: Sikoia
description: >-
  Sikoia is a UK-based (FCA-authorised AISP), ISO 27001-certified customer-verification platform for
  financial services. Its REST API automates KYC/KYB and onboarding by grouping companies and people into
  cases and enriching them with company registry data, company & consumer credit reports, identity
  verification (IDV), open banking, document upload with classification/extraction and integrity/tampering
  checks, income & employer verification, affordability insights, PEPs & sanctions and adverse-media
  screening, plus validation/completeness checklists. The v2 API uses OAuth 2.0 client-credentials, JSON
  over HTTPS, HMAC-signed webhooks, and a documented rate-limit, error, and deprecation model.
