          description: The country code of the selected institution
          nullable: true
          example: GB
        institution_name:
          type: string
          description: Name of the institution
          nullable: true
          example: Sandbox
        institution_logo:
          type: string
          description: Logo of the institution
          nullable: true
          example: https://logolink.com
        account_connection_ids:
          type: array
          items:
            type: string
          description: List of connected accounts as Account Connection IDs
          nullable: true
          example: '["820eec09-dbdd-4c90-b0f2-acbca66f1ad5", "132d3353-ad29-46e0-b66a-caed8b572e93", "93886787-3307-4319-afa7-48540bf21362"]'
