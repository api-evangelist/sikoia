            application/json:
              schema:
                $ref: '#/components/schemas/SikoiaSharedModels.OpenBanking.OpenBanking.GetAccountDetailsResponse'
              example:
                account_connection_id: 132d3353-ad29-46e0-b66a-caed8b572e93
