              example:
                type: ServerError
                status: 500
                title: Internal Server Error
                detail: Something has gone wrong, please try again
                correlation_id: 12f7d835-67a3-4146-a5f9-74d106485fbc
components:
  schemas:
    SikoiaSharedModels.Company.External.Response.Mapped.NextAccounts:
      title: Next Accounts
      type: object
      properties:
        overdue:
          type:
          - boolean
          - 'null'
          description: Is Next Accounts Overdue?
        period_start:
          type:
          - string
          - 'null'
          description: Start Period for Next Accounts
        period_end:
          type:
          - string
          - 'null'
          description: End Period for Next Accounts
        due_date:
          type:
          - string
          - 'null'
          description: Due Date for Next Accounts
          readOnly: true
      additionalProperties: false
    SikoiaSharedModels.Company.External.Response.Mapped.Details:
      title: Details
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
          description: The Details Type
        description:
          type:
          - string
          - 'null'
          description: The Details Description
      additionalProperties: false
    SikoiaSharedModels.Company.External.Response.Mapped.CompanySearchMappedResponse:
      title: Company Search Response
      type: object
      properties:
        index:
          type:
          - integer
          - 'null'
          description: The index of the company
          format: int32
          example: '1'
        company_name:
          type:
          - string
          - 'null'
          description: The legal name of the company
          example: ACME INC
        company_number:
          type:
          - string
          - 'null'
          description: The company registration number
          example: '12345678'
        company_status:
          type:
          - string
          - 'null'
          description: The operational status of the company
          example: Active
        provider_id:
          type:
          - string
          - 'null'
          description: The data provider’s ID for the company
        date_established:
          type:
          - string
          - 'null'
          description: The date the company was established
          example: '1982-01-07'
        country_code:
          type:
