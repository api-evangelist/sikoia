  /v2/company-registry-data/search:
    post:
      tags:
      - Company Registry
      summary: Search for a company
      description: '### Searches for a company in business registries.


        Search using the `company_name` and at least one of `jurisdiction_code` or `country_code`. If both codes are specified, jurisdiction_code takes priority.


        You can exclude inactive companies from results by setting `exclude_inactive` to `true`.


        If your search is associated with a specific company entity instead of a standalone search, include the `company_id` in the request. Keep in mind that even when using a `company_id`, the search data is transient and won''t be stored against the company.'
      operationId: POST_v2-company-registry-data-search
      parameters:
      - name: items_per_page
        in: query
        schema:
          type: integer
          description: Items Per Page
          format: integer
          default: 100
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SikoiaSharedModels.Company.External.Request.CompanySearchRequest'
            example:
              company_name: Acme Inc
              jurisdiction_code: GB
              country_code: GB
              exclude_inactive: 'true'
              company_id: 78662640-73fc-4fa9-8367-ef4660d35cee
      responses:
        '200':
          description: Companies Retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SikoiaSharedModels.Company.External.Response.Mapped.CompanySearchMappedResponse'
              example:
              - index: '1'
                company_name: ACME INC
                company_number: '12345678'
                company_status: Active
                provider_id: string
                date_established: '1982-01-07'
                country_code: GB
                branch_status: string
                official_address:
                  address_line_1: 10 Main Street
                  address_line_2: Apt. 101
                  address_line_3: Main House
                  address_line_4: string
                  city: Test Town
                  region: Test Country
                  country: GB
                  post_code: X9 9AA
                  full_address: 123 Main Street, Main House, Apt. 101, Test County, Test Town, X9 9AA, GB
        '400':
          description: Company Entity Deleted/Not Found or Country Not Recognised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SikoiaCore.Common.SikoiaErrorResponse'
              example:
                type: InvalidRequest
                status: 400
                title: Validation Errors
                detail: Entity Id is required.
                correlation_id: 5114e597-5de1-443b-b28f-912f9b61d882
        '401':
