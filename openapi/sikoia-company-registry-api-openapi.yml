          - 'null'
          description: "The Sikoia standardised company status. Possible values are:\n- **Active**: The company is actively trading.\n- **Restricted**: The company is not dissolved, but it's not trading normally. This includes companies in Administration, Liquidation or Dormant. Companies whose filings have some irregularity will also have this status.\n- **Closed**: The company has been dissolved. Merged companies will also have this status. \n- **Other**: The registry status could not be mapped to any of the above. \n"
