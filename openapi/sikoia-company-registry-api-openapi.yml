          type:
          - string
          - 'null'
          description: The Data Provider
        generic_legal_form:
          type:
          - string
          - 'null'
          description: "The Sikoia standardised legal form. Possible values are:\n- **Public Company**: A company whose ownership is distributed amongst general public shareholders through publicly-traded stock shares.\n- **Limited Company**: A private company whose owners are legally responsible for its debts only to the extent of the amount of capital they invested.\n- **Partnership**: A business owned by two or more people who share profits and losses.\n- **Investment Company**: A regulated entity that pools and manages investors' capital, investing in securities and other financial instruments.\n- **Cooperative**: A business owned and operated by its members for their mutual benefit.\n- **Sole Proprietorship**: A type of business owned and operated by a single person.\n- **Government Entity**: A legal entity created by a government to carry out a specific function or service.\n- **Other**: The registry legal form could not be mapped to any of the above. \n"
        registry_legal_form:
          type:
          - string
          - 'null'
          description: The Registry Legal Form
        country_code:
          type:
          - string
          - 'null'
          description: The Country Code
