        datetime_created:
          type: string
          description: The time the case was created
          nullable: true
          readOnly: true
          example: '2023-02-10T10:59:46.026Z'
        datetime_last_modified:
          type: string
          description: The time the case was last modified
          nullable: true
          readOnly: true
          example: '2023-02-12T13:04:21.326Z'
