        \ the company entity is missing `company_number` or `country_code`.\r\n\r\nAlternatively, you can override the company\
        \ entity details by sending `company_number`, `company_name`, and `country_code` alongside the `company_id` in the\
        \ request body. The credit report returned will be associated with the `company_id` on the request.\r\n\r\nAs a third\
        \ option, you can send a 3rd party data provider `provider_id` for a specific company within their system. The credit\
        \ report returned will be associated with the `company_id` on the request.\r\n\r\nIf resolving the credit report to\
        \ a single company is not possible, the response will have a status of `TooManyResults`. You can resolve this picklist\
        \ using the `POST /v2/company-credit-reports/picklist` endpoint.\r\n\r\n"
