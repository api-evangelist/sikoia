  /v2/peps-sanctions:
    post:
      tags:
      - PEPs & Sanctions
      summary: Request PEPs & Sanctions search
      description: "### Requests a PEPs & Sanctions search for an entity.\r\n\r\nCheck if the entity is listed in any Politically\
        \ Exposed Persons (PEPs) or Sanctions lists.\r\n\r\n* If the `entity_type` is case, a `search_term` must be included.\r\
