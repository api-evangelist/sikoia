      - entity_id
      - entity_type
      type: object
      properties:
        entity_id:
          type: string
          description: The `company_id`, `person_id` or `case_id` of the entity
          format: uuid
          example: 78662640-73fc-4fa9-8367-ef4660d35cee
        entity_type:
          enum:
          - company
          - person
          - case
          type: string
          description: The type of the entity
          example: company
        country_code:
          type: string
          description: Must be ISO 2 digit country code. Limits the institution selection to country provided.
          nullable: true
          example: GB
      additionalProperties: false
    SikoiaSharedModels.OpenBanking.OpenBanking.CreateTokenResponse:
      title: Open Banking Connection
      type: object
      properties:
        bank_connection_id:
          type: string
          description: The Open Banking Connection ID
          format: uuid
          nullable: true
          readOnly: true
          example: e81154bd-f85f-4223-8b4f-36643843fa99
        bank_connection_url:
          type: string
          description: The URL for the bank connection consent flow
          format: url
          nullable: true
          example: https://verify.sikoia.com/openbanking/123456
        entity_id:
          type: string
          description: The `company_id`, `person_id` or `case_id` of the entity
          format: uuid
          readOnly: true
          example: 78662640-73fc-4fa9-8367-ef4660d35cee
        entity_type:
          enum:
          - company
          - person
          - case
          type: string
          description: The type of the entity
          nullable: true
          example: company
        datetime_requested:
          type: string
          description: The time the connection was requested
          format: date-time
          nullable: true
          readOnly: true
          example: '2024-02-12T04:21:07.0000000+00:00'
        datetime_refreshed:
          type: string
          description: The time the connection was refreshed
          format: date-time
          nullable: true
          readOnly: true
          example: '2024-02-11T04:21:07.0000000+00:00'
        datetime_connected:
          type: string
          description: The time the connection was connected
          format: date-time
          nullable: true
          readOnly: true
          example: '2024-02-14T04:21:07.0000000+00:00'
        datetime_expiry:
          type: string
          description: The expiry time of the connection
          format: date-time
          nullable: true
          readOnly: true
          example: '2024-05-12T04:24:34.0000000+00:00'
        status:
          type: string
          description: The connection status(`Created` `SelectingInstitutions` `Rejected` `Authorising` `Connected` `Deleted`)
          nullable: true
          example: Connected
        country_code:
          type: string
          description: The country code of the selected institution
          nullable: true
          example: GB
        institution_name:
          type: string
          description: Name of the institution
