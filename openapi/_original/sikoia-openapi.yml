  /v2/company-registry-data:
    post:
      tags:
      - Company Registry
      summary: Request registry data
      description: "### Requests registry data for a company.\r\n\r\nYou can create a request with only the `company_id`,\
        \ and the necessary data will be retrieved from the company entity. If the company entity is missing `company_number`\
        \ or `country_code`, a 422 - Unprocessable error will be raised.\r\n\r\nAlternatively, you can override the company\
        \ entity details by sending `company_number`, `company_name`, and `country_code` alongside the `company_id` in the\
        \ request body.  \r\n\r\nIf it is not possible to identify a single company in the relevant registry based on the\
        \ data provided, the response will have a status of `TooManyResults`. You can resolve this picklist using the `POST\
        \ /v2/company-registry-data/picklist endpoint`.\r\n"
      operationId: POST_v2-company-registry-data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SikoiaSharedModels.Company.External.Request.RegistryDataRequest'
            example:
              company_id: 78662640-73fc-4fa9-8367-ef4660d35cee
              company_number: '12345678'
              company_name: Acme Inc
              country_code: GB
      responses:
        '201':
          description: Registry Data Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SikoiaSharedModels.Company.External.Response.RegistryDataResponse'
              example:
                request_id: 276c102b-85d3-4e86-a69d-de1b2ba72150
                status: Complete
                company_id: 78662640-73fc-4fa9-8367-ef4660d35cee
                datetime_requested: '2024-02-12T13:18:28.9780000+00:00'
                message: string
                company_number: '12345678'
                company_name: Acme Inc
                country_code: GB
                picklist: '[]'
        '400':
          description: Company Entity Deleted/Not Found or Country Not Recognised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SikoiaCore.Common.SikoiaErrorResponse'
              example:
                type: InvalidRequest
                status: 400
