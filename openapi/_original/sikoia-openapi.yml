  /v2/cases:
    get:
      tags:
      - Cases
      summary: List all cases
      description: "### Returns a list of all cases.\r\n\r\nThis list can be filtered using query parameters such as `case_type`,\
        \ `stage`, `source`, `owner`, `owner_id` and `keyword`.\r\n\r\nThe `keyword` query parameter searches for matching\
        \ strings within the Case's `name`, `reference` and `description` fields.\r\n\r\nSupport for multiple filters is available\
        \ by separating them with a comma. For instance, to retrieve all approved and rejected cases, use the `stage` query\
        \ parameter with the value `Approved,Rejected`.\r\n"
      operationId: GET_v2-cases
      parameters:
      - name: case_type
        in: query
        description: Case Types
        schema:
          enum:
          - Business
          - Consumer
          type: string
      - name: stage
        in: query
        description: Case Stages
        schema:
          enum:
          - New
          - InProgressWaitingCustomer
          - InProgressNeedsReview
          - Approved
          - Rejected
          - Dormant
          type: string
      - name: source
        in: query
        description: Source
        schema:
          type: string
      - name: owner
        in: query
        description: Owner
        schema:
          type: string
          deprecated: true
      - name: owner_id
        in: query
        description: Owner Id
        schema:
          type: string
      - name: keyword
        in: query
        description: Keywords
        schema:
          type: string
      responses:
        '200':
          description: List of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SikoiaSharedModels.CaseManagement.Responses.CasesResponse'
