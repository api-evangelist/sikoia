                title: Internal Server Error
                detail: Something has gone wrong, please try again
                correlation_id: a28d1abd-ad97-4a1f-bd14-6698c5214544
components:
  schemas:
    MicroserviceUserManagement.Resources.External.Webhook:
      required:
      - event_types
      - webhook_callback_url
      - webhook_name
      type: object
      properties:
        webhook_id:
          type: string
          format: uuid
          readOnly: true
        webhook_name:
          maxLength: 50
          minLength: 1
          type: string
          description: The user friendly, case sensitive, name for a webhook - it does not have to be unique
          example: Bank Statement Hook
        webhook_callback_url:
          maxLength: 2048
          minLength: 1
          type: string
          description: The absolute HTTPS URL that a POST request will be made to when the webhook is triggered
          example: https://yourdomain.com/webhook/
        external_ref:
          type: string
          description: Optional value if you need to associate a webhook instance with a reference in your system
          nullable: true
          example: IntRef001
        event_types:
          minItems: 1
          type: array
          items:
            type: string
          description: Supported events a webhook can subscribe to
          example: '["BankStatementProcessing.Completed"]'
        datetime_created:
          type: string
          description: 'UTC Date and time when the webhook was created, formatted: yyyy-MM-ddTHH:mm:ss.fffZ'
          format: date-time
          readOnly: true
          example: '2024-01-18T12:37:35.0000000+00:00'
        datetime_updated:
          type: string
          description: 'UTC Date and time when the webhook was last updated, formatted: yyyy-MM-ddTHH:mm:ss.fffZ'
          format: date-time
          readOnly: true
          example: '2024-01-18T12:37:35.0000000+00:00'
      additionalProperties: false
