        webhook_name:
          type: string
          description: The user friendly, case sensitive, name for a webhook - it does not have to be unique
          nullable: true
          example: Bank Statement Hook
        webhook_callback_url:
          type: string
          description: The absolute HTTPS URL that a POST request will be made to when the webhook is triggered
          nullable: true
          example: https://yourdomain.com/webhook/
        external_ref:
          type: string
          description: Optional value if you need to associate a webhook instance with a reference in your system
          nullable: true
          example: IntRef001
