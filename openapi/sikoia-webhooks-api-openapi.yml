          nullable: true
          example: '["BankStatementProcessing.Completed"]'
      additionalProperties: false
    MicroserviceUserManagement.Domain.Model.Webhooks.WebhookEventStatusCode:
      enum:
      - NotRequested
      - Pending
      - Complete
      - Failed
      type: string
    MicroserviceUserManagement.Resources.External.WebhookRequest:
      type: object
      properties:
        request_id:
          type: string
          description: The unique identifier of a single webhook request
          format: uuid
          readOnly: true
          example: 2bf8cbc7-b646-41ad-9881-4944ad2b786e
        grouping_id:
          type: string
          description: The identifier that groups related webhook requests triggered by the same event
          format: uuid
          readOnly: true
          example: 07322b4b-6739-486c-9eb4-5466a8bc1875
        event_type:
          type: string
          description: The specific event type that triggered a webhook request being sent
          readOnly: true
          example: BankStatementProcessing.Completed
        webhook_callback_url:
          type: string
          description: The URL that the request was made to
          example: https://yourdomain.com/webhook/
        datetime_created:
          type: string
          description: An optional value that indicates when a webhook was successfully received at a given callback url
          format: date-time
          nullable: true
          readOnly: true
          example: '2024-01-18T12:37:35.0000000+00:00'
        event_data:
          description: The exact event data sent in the body of the webhook request
          example: '{"key":"value","key2":"value2"]}'
        webhook_event_status:
          type: string
          description: The exact status a request has been marked with
          example: Complete
        request_attempts:
          type: array
          items:
            $ref: '#/components/schemas/MicroserviceUserManagement.Resources.External.WebhookRequestAttempt'
          description: Each unique attempt at delivering a webhook before a success response was returned
          example: '[{"attempt_id":"8b1391e4-7ace-41a2-a04b-55decffb9fe5","requested_on":"2024-01-18T12:37:35.053Z","http_response_code":200}]'
      additionalProperties: false
      description: Represents a historic request made after a webhook was triggered by event in the Sikoia platform
    MicroserviceUserManagement.Resources.External.WebhookSecret:
      type: object
      properties:
        shared_key:
          type: string
          description: The UTF8 encoded value used as the key in the SHA256 hash.
          readOnly: true
        date_created:
          type: string
          description: 'The timestamp for when the secret started being used to add a HMACSHA256 header to all webhook requests. Formatted: yyyy-MM-ddTHH:mm:ss.fffZ'
          format: date-time
          readOnly: true
        date_updated:
          type: string
          description: 'The timestamp for when the key last changed. If a key is rotated this will be different to the date_created. Formatted: yyyy-MM-ddTHH:mm:ss.fffZ'
          format: date-time
          readOnly: true
      additionalProperties: false
      description: The current secret used as the shared key for the HMACSHA256 header.
